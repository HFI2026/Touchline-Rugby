function render(){const views={home,selection,match:matchView,awards,calendar,attendance,squad,leagues,insights,settings};$('view').innerHTML=(views[page]||home)();wire();}function home(){let next=upcoming()[0],m=match();return head('Good afternoon, coach','Your touchline, organised.',`<button class="btn" onclick="setPage('selection')">Build your team →</button>`)+`<div class="grid stats">${[['Squad players',state.players.length],['Starting spots',size()],['Bench selected',state.bench.length],['Upcoming events',upcoming().length]].map(([a,b])=>c(`<div class="label">${a}</div><div class="metric">${b}</div>`)).join('')}</div><div class="columns"><div class="stack">${c(`<div class="row"><h2>Next up</h2><span class="tag">${next?esc(next.type):'No events'}</span></div>${next?`<div style="font-size:25px;font-weight:900">${esc(next.type==='Match'?'vs '+next.opposition:'Team training')}</div><div class="sub">${dt(next.date)} · ${esc(next.time)} · ${esc(next.venue)}</div><div class="divider"></div><button class="btn alt" onclick="setPage('calendar')">Open team diary</button>`:'Add a fixture or training event to get started.'}`)}${c(`<h2>Match-day preparation</h2><div class="stack"><div class="row"><span>Starting lineup</span><strong>${Object.values(state.selection).filter(Boolean).length}/${size()}</strong></div><div class="row"><span>Substitutes selected</span><strong>${state.bench.length}</strong></div><button class="btn" onclick="setPage('selection')">Manage selection</button></div>`)}</div><div class="stack">${c(`<h2>Quick actions</h2><div class="stack"><button class="btn alt" onclick="setPage('match')">◉ Record a match score</button><button class="btn alt" onclick="setPage('awards')">★ Match awards & voting</button><button class="btn alt" onclick="setPage('attendance')">✓ Log training attendance</button><button class="btn alt" onclick="setPage('squad')">♙ Add squad members</button><button class="btn alt" onclick="setPage('insights')">◫ View season insights</button></div function selection(){let taken=new Set([...Object.values(state.selection),...state.bench]);let spots=Array.from({length:size()},(_,i)=>{let id=state.selection[i+1],p=player(id);return `<div class="slot ${p?'filled':''}" data-slot="${i+1}" title="Drop or tap to assign"><span class="num">${i+1}${size()===15?' · '+esc(pos[i]):''}</span>${p?`<strong>${esc(p.name)}</strong><button class="remove" onclick="clearSlot(${i+1},event)">Remove ×</button>`:'<strong>Tap to assign</strong>'}</div>`});let available=state.players.filter(p=>!taken.has(p.id));return head('Team selection','Create your starting side, place your replacements and prepare your team sheet.',`<div class="topactions"><button class="btn alt" onclick="downloadTeamSheet()">Download team sheet</button><button class="btn alt" onclick="clearLineup()">Clear selection</button></div>`)+`<div class="toolbar"><select id="lineupMatch" class="field" aria-label="Fixture for selection" style="max-width:300px">${state.fixtures.filter(f=>f.type==='Match').map(f=>`<option value="${esc(f.id)}" ${match()?.id===f.id?'selected':''}>${dt(f.date)} · vs ${esc(f.opposition)}</option>`).join('')}</select><span class="pill">${esc(state.age)} · ${size()} a-side</span><span class="pill">${Object.values(state.selection).filter(Boolean).length} starters</span><span class="pill">${state.bench.length} substitutes</span></div><div class="columns" style="grid-template-columns:minmax(0,1.5fr) minmax(270px,1fr)"><div class="stack">${c(`<h2>Starting lineup</h2><div class="pitch"><div class="pitchline"></div><div class="pitchgrid">${spots.join('')}</div></div><h3 style="margin-top:17px">Substitutes bench</h3><div class="bench" data-bench="true">${state.bench.map((id,i)=>{let p=player(id);return `<div class="chip" draggable="true" data-player="${id}" onclick="pick('${id}')"><b>${size()+i+1}.</b> ${esc(p?.name||id)} <button class="remove" onclick="benchRemove('${id}',event)">×</button></div>`}).join('')||'<span class="sub">Tap “Add to bench” after sel function suggestions(){return state.bench.flatMap(id=>{const p=player(id);return Array.from({length:size()},(_,i)=>{const assigned=player(state.selection[i+1]);const compatible=(p.primary===i+1||p.secondary.includes(i+1));return assigned&&compatible?`<div class="listrow"><div><b>${esc(p.name)}</b> <span class="muted">for ${esc(assigned.name)}</span><div class="tiny">${p.primary===i+1?'Primary':'Secondary'} position · #${i+1}</div></div><button class="btn sm soft" onclick="swapFromBench('${id}',${i+1})">Make change</button></div>`:null})}).filter(Boolean).join('')||'<p class="sub">Select a starting lineup and bench to see position-matched options.</p>'}function pick(id){selectedPlayer=selectedPlayer===id?null:id;render()}function assignSlot(n,id=selectedPlayer){if(!id)return;let old=state.selection[n],other=Object.keys(state.selection).find(k=>state.selection[k]===id);if(other)state.selection[other]=old||null;else if(old)state.bench.push(old);state.bench=state.bench.filter(x=>x!==id);state.selection[n]=id;selectedPlayer=null;save();render()}function clearSlot(n,e){e.stopPropagation();delete state.selection[n];save();render()}function clearLineup(){state.selection={};state.bench=[];save();render()}function addBench(){if(!selectedPlayer)return;let id=selectedPlayer;Object.keys(state.selection).forEach(k=>{if(state.selection[k]===id)delete state.selection[k]});if(!state.bench.includes(id))state.bench.push(id);selectedPlayer=null;save();render()}function benchRemove(id,e){e.stopPropagation();state.bench=state.bench.filter(x=>x!==id);save();render()}function swapFromBench(id,n){let old=state.selection[n];state.selection[n]=id;state.bench=state.bench.filter(x=>x!==id);if(old)state.bench.push(old);save();render()}

function pitchState(m,through=Infinity){
 const initial=state.lineups[m.id]?.selection||((m.id===state.matchId)?state.selection:{});
 const starters=Object.values(initial).filter(Boolean);const playing=new Set(starters);
 const bench=state.lineups[m.id]?.bench||((m.id===state.matchId)?state.bench:[]);
 const minutes=Object.fromEntries([...new Set([...starters,...bench])].map(id=>[id,0]));
 const log=[...(m.substitutions||[])].sort((a,b)=>a.minute-b.minute||a.order-b.order);
 let clock=0;
 for(const s of log){if(s.minute>through)break;const t=Math.min(Math.max(Number(s.minute)||0,clock),m.matchMinutes||60);
  for(const id of playing) minutes[id]=(minutes[id]||0)+(t-clock);
  clock=t;playing.delete(s.off);playing.add(s.on);minutes[s.on]??=0;
 }
 const end=Math.min(through,m.matchMinutes||60);
 for(const id of playing) minutes[id]=(minutes[id]||0)+Math.max(0,end-clock);
 return {playing,minutes,starters,bench};
}
function recordSubstitution(form){const m=match();if(!m)return;const data=new FormData(form),on=String(data.get('on')),off=String(data.get('off')),minute=Number(data.get('minute'));
 if(!Number.isInteger(minute)||minute<0||minute>(m.matchMinutes||60))return alert('Enter a valid minute within the match duration.');
 if(!on||!off||on===off)return alert('Choose two different players.');
 const last=Math.max(0,...(m.substitutions||[]).map(s=>s.minute));
 if(minute<last)return alert('Enter substitutions chronologically, or remove later substitutions first.');
 const cur=pitchState(m,last);if(!cur.playing.has(off)||cur.playing.has(on))return alert('The replacement must be off the pitch and the outgoing player must be on it.');
 const eligible=new Set([...cur.starters,...cur.bench,...m.substitutions.map(s=>s.on)]);
 if(!eligible.has(on))return alert('The replacement must be selected in the match-day squad.');
 m.substitutions.push({id:uid('sub'),minute,on,off,order:m.substitutions.length});save();render();
}
function removeSubstitution(id){const m=match();if(!confirm('Remove this substitution? Later changes may need reviewing.'))return;m.substitutions=m.substitutions.filter(s=>s.id!==id);save();render()}
function substitutePanel(m){const initial=pitchState(m,0);const current=pitchState(m,Math.max(0,...m.substitutions.map(s=>s.minute)));
 const options=ids=>ids.map(id=>`<option value="${esc(id)}">${esc(player(id)?.name||'Player removed')}</option>`).join('');
 const all=[...new Set([...current.starters,...current.bench,...m.substitutions.map(s=>s.on)])];
 const out=[...current.playing],on=all.filter(id=>!current.playing.has(id));

function awards(){let matches=state.fixtures.filter(f=>f.type==='Match'),m=match();if(!m)return head('Player of the match','Add a match fixture to begin.');m.awards??={votes:{},coach:'',closed:false};let a=m.awards,counts={};Object.values(a.votes).forEach(id=>counts[id]=(counts[id]||0)+1);let leaderboard=Object.entries(counts).sort((x,y)=>y[1]-x[1]),max=leaderboard[0]?.[1]||0,winners=leaderboard.filter(([id,n])=>n===max).map(([id])=>player(id)?.name||'Unknown player');let voted=Object.keys(a.votes).length,eligible=state.parents.length;return head('Player of the match','Parents’ vote and coaches’ award, recorded separately for each match.',`<button class="btn alt" onclick="setPage('match')">Back to match centre</button>`)+`<div class="toolbar"><select class="field" style="max-width:320px" id="awardsMatch">${matches.map(f=>`<option value="${esc(f.id)}" ${m.id===f.id?'selected':''}>${dt(f.date)} · ${esc(f.opposition)}</option>`).join('')}</select><span class="pill">${a.closed?'Voting closed':'Voting open'}</span><span class="pill">${voted} / ${eligible} parent votes</span></div><div class="columns"><div class="stack">${c(`<div class="row"><h2>Parents’ Player of the Match</h2><span class="tag">One vote per registered parent</span></div><p class="sub">Select a registered parent and the player they wish to nominate. Votes are linked to the parent's record and can be changed until the poll closes.</p><form id="voteForm" class="stack"><label class="fieldbox"><span class="label">Parent / guardian</span><select class="field" name="parent" required><option value="">Choose parent...</option>${state.parents.map(g=>`<option value="${esc(g.id)}">${esc(g.name)} (${esc(player(g.child)?.name||'Player removed')})${a.votes[g.id]?' · voted':''}</option>`).join('')}</select></label><label class="fieldbox"><span class="label">Vote for player</span><select class="field" name="player" required><option value="">Choose player...</option>${state.players.map(p=>`<option value="${esc(p.id)}">${e
